name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm and GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
            const tag = process.env.GITHUB_REF_NAME
            if (tag !== 'v' + version) {
              console.error('tag ' + tag + ' does not match package version ' + version)
              process.exit(1)
            }
          "

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack the tarball
        run: npm pack

      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
